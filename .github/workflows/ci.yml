name: GoIt Java Dev Exam Project CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Check for test coverage 80%
        run: ./gradlew check

      - name: Build and test with Gradle
        run: ./gradlew clean test